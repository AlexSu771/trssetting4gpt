<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hoja de Setting</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="Hoja de setting de suspensiones para entregar al cliente en PDF.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hoja Setting">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Una columna en móvil. Solo se desplazan de lado las tablas de settings y de mantenimiento, cada una dentro de su ventana. */
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
:root{
  --bg:#f2f3f5; --card:#ffffff; --ink:#141a22; --muted:#596373; --line:#d8dce3; --field:#ffffff;
  --btn:#141a22; --btn-fg:#ffffff;
  --card-hi:#ffffff; --card-lo:#eceff3; --shadow-c:rgba(20,26,34,.30); --hl:rgba(255,255,255,.85);
  --neg-ink:#b42318; --pos-ink:#0f7a38;
  --brand:#d3111f;
  --font-head:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1217; --card:#161b22; --ink:#edf0f4; --muted:#98a3b3; --line:#2a323d; --field:#0e1217;
    --btn:#edf0f4; --btn-fg:#10151b; --neg-ink:#ff8f8f; --pos-ink:#5ee08e;
    --card-hi:#1f2833; --card-lo:#10151b; --shadow-c:rgba(0,0,0,.75); --hl:rgba(255,255,255,.09);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1217; --card:#161b22; --ink:#edf0f4; --muted:#98a3b3; --line:#2a323d; --field:#0e1217;
  --btn:#edf0f4; --btn-fg:#10151b; --neg-ink:#ff8f8f; --pos-ink:#5ee08e;
  --card-hi:#1f2833; --card-lo:#10151b; --shadow-c:rgba(0,0,0,.75); --hl:rgba(255,255,255,.09);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  background:var(--bg); color:var(--ink); font:15px/1.45 var(--font-body);
  padding-block:14px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden;overflow-x:clip;
}
.app{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance}
h1{font-size:1.45rem;font-weight:700}
h2{font-size:1.15rem;font-weight:700}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hint{margin:4px 0 0;color:var(--muted);font-size:13px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Cabecera */
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.logo{display:block;width:min(88%,400px);height:auto;margin:0 auto}
.tel{margin:0;color:#fff;font-size:1.2rem;font-weight:600;letter-spacing:.06em}
.hero h1{color:#ffa51f;font-size:2rem;letter-spacing:.04em;text-transform:uppercase;margin-top:6px;text-shadow:0 0 18px rgba(255,165,31,.35)}
.hero p.sub{margin:0;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase}

/* Paneles y botones con relieve */
.panel{background:linear-gradient(180deg,var(--card-hi),var(--card-lo));border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 12px 22px -14px var(--shadow-c),0 1px 3px rgba(0,0,0,.1),inset 0 1px 0 var(--hl)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{height:44px;padding:0 18px;border-radius:9px;border:0;font-weight:600;cursor:pointer;flex:1 1 150px;
  background-color:var(--btn);color:var(--btn-fg);
  background-image:linear-gradient(180deg,color-mix(in srgb,var(--btn) 86%,#fff),var(--btn));
  box-shadow:0 8px 14px -8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.brand{background-color:var(--brand);background-image:linear-gradient(180deg,#ee3a44,#b00c18);color:#fff}
.btn.alt{background-color:transparent;color:var(--ink);border:1px solid var(--line);
  background-image:linear-gradient(180deg,var(--card-hi),var(--card-lo));box-shadow:0 5px 10px -6px var(--shadow-c),inset 0 1px 0 var(--hl)}
.btn:active{transform:translateY(1px);box-shadow:inset 0 2px 5px rgba(0,0,0,.4)}
.msg{margin:10px 0 0;min-height:18px;font-size:13px;color:var(--muted)}
.msg.err{color:var(--neg-ink);font-weight:600}

/* Secciones de la ficha: mismos colores que las cuentas de Cuenta Mensual */
.s-moto{--head-bg:#3b3a8f;--head-fg:#ffffff}
.s-fork{--head-bg:#60a5fa;--head-fg:#111111}
.s-shock{--head-bg:#f59e0b;--head-fg:#111111}
.s-peso{--head-bg:#475058;--head-fg:#ffffff}
.s-mant{--head-bg:#2d3a4a;--head-fg:#ffffff}
.s-moto,.s-fork,.s-shock,.s-peso,.s-mant{
  --head-g:linear-gradient(170deg,color-mix(in srgb,var(--head-bg) 82%,#fff) 0%,var(--head-bg) 52%,color-mix(in srgb,var(--head-bg) 82%,#000) 100%);
  --tint:color-mix(in srgb,var(--head-bg) 22%,var(--card));
}
.sec{border-radius:14px;border:1px solid var(--line);overflow:hidden;
  background:linear-gradient(180deg,var(--card-hi),var(--card-lo));
  box-shadow:0 16px 26px -16px var(--shadow-c),0 1px 3px rgba(0,0,0,.1),inset 0 1px 0 var(--hl)}
.sec-h{padding:14px 16px;background-color:var(--head-bg);background-image:var(--head-g);color:var(--head-fg);
  display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.2)}
.sec-t{font:700 1.5rem var(--font-head);letter-spacing:.04em;text-transform:uppercase;text-align:center}
.colsel{height:38px;max-width:100%;border-radius:8px;border:1px solid rgba(255,255,255,.55);background:#000;color:#fff;padding:0 10px;font-weight:600;cursor:pointer;box-shadow:0 4px 8px -4px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.18)}
.sec-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.subh{margin:2px 0 -4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
input[type=text],input[type=date]{height:42px;min-width:0;width:100%;border-radius:8px;border:1px solid var(--line);background:var(--field);padding:0 10px;box-shadow:inset 0 2px 4px rgba(0,0,0,.14)}
input::placeholder{color:var(--muted);opacity:.7}

/* Tablas con desplazamiento lateral propio */
.tablewrap{position:relative;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
.set{min-width:740px}
.set th,.set td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:center}
.set tr:last-child th,.set tr:last-child td{border-bottom:0}
.set thead th{background:var(--tint);font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:9px 4px}
.set th.lab{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;white-space:nowrap;padding:5px 12px;font-size:13px;font-weight:700;box-shadow:2px 0 4px -2px rgba(0,0,0,.18)}
.set thead th.lab{background:var(--tint)}
.set input{width:84px;height:36px;text-align:center;padding:0 4px;font-size:14px}
.set td.tot input{font-weight:700;border-color:var(--head-bg)}
.mt{min-width:680px;font-size:12.5px}
.mt th,.mt td{padding:8px 6px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);text-align:center;line-height:1.3}
.mt thead th{background:var(--tint);font-size:11px;font-weight:700;letter-spacing:.03em}
.mt th.lab{position:sticky;left:0;z-index:1;background:var(--card);border-left:0;text-align:left;white-space:nowrap;font-size:12px;box-shadow:2px 0 4px -2px rgba(0,0,0,.18)}
.mt thead th.lab{background:var(--tint)}
.mt tr:last-child th,.mt tr:last-child td{border-bottom:0}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--brand)}

/* Fichas guardadas */
.fitem{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.fitem:last-child{border-bottom:0}
.fitem .open{background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;min-width:0}
.fitem .open strong{display:block;overflow-wrap:anywhere}
.fitem .open span{display:block;font-size:12.5px;color:var(--muted)}
.fitem.cur .open strong::after{content:"Abierta";margin-left:8px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--brand);border-radius:6px;padding:2px 6px;vertical-align:middle}
.mini{border:1px solid var(--line);border-radius:8px;height:34px;padding:0 10px;cursor:pointer;white-space:nowrap;
  background-color:transparent;background-image:linear-gradient(180deg,var(--card-hi),var(--card-lo));box-shadow:0 4px 8px -5px var(--shadow-c),inset 0 1px 0 var(--hl)}
.mini.armed{background:var(--brand);border-color:transparent;color:#fff;font-weight:600}

/* Pie */
.foot{text-align:center;color:var(--muted);font-size:13px}
.foot b{color:var(--ink)}
.foot .logo{height:38px}
/* Aspecto negro tecnológico: fondo negro, casillas en relieve 3D y bordes rojos (siempre, claro u oscuro) */
:root:root:root{
  color-scheme:dark;
  --bg:#000000; --card:#0b0d10; --ink:#f2f4f7; --muted:#9aa3b0; --line:#5a0f16; --field:#050607;
  --btn:#f2f4f7; --btn-fg:#0b0d10; --neg-ink:#ff6b6b; --pos-ink:#5ee08e;
  --card-hi:#1d2229; --card-lo:#07080a; --shadow-c:rgba(0,0,0,.95); --hl:rgba(255,255,255,.12);
  --red:#e0202e; --red-glow:rgba(224,32,46,.45);
}

  background-attachment:scroll}
body{background:transparent}
.hero .tel,.hero p.sub{text-shadow:0 1px 3px #000,0 0 8px #000}
.hero h1{text-shadow:0 0 18px rgba(255,165,31,.35),0 2px 4px #000}
.panel,.sec,.tablewrap{border:1px solid var(--red);
  box-shadow:0 14px 24px -12px #000,0 0 12px -4px var(--red-glow),inset 0 1px 0 var(--hl),inset 0 -2px 0 rgba(0,0,0,.6)}
.sec-h{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.35),0 2px 0 var(--red)}
input[type=text],input[type=date]{border:1px solid #7a1520;background:linear-gradient(180deg,#000,#0d1014);
  box-shadow:inset 0 3px 6px rgba(0,0,0,.9),inset 0 -1px 0 rgba(255,255,255,.07),0 1px 0 rgba(255,255,255,.06)}
input:focus{border-color:var(--red);box-shadow:inset 0 3px 6px rgba(0,0,0,.9),0 0 0 2px var(--red-glow);outline:0}
.set td.tot input{border-color:var(--red)}
.set th.lab,.mt th.lab{background:#0b0d10}
.set thead th.lab,.mt thead th.lab{background:var(--tint)}
.set th,.set td,.mt th,.mt td{border-color:#3a0b10}
.btn.alt,.mini{border:1px solid var(--red);color:var(--ink)}
.btn.brand{box-shadow:0 0 16px -3px var(--red-glow),0 8px 14px -8px #000,inset 0 1px 0 rgba(255,255,255,.35)}
.fitem{border-color:#3a0b10}
.foot .logo{height:38px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function emptyRows(rows){const o={};rows.forEach(r=>{o[r[0]]=['','','','','','','']});return o}
function newFicha(){
  return {id:uid(),ts:Date.now(),
    moto:{marca:'',modelo:'',anio:'',modalidad:'',color:'indigo'},
    fork:{marca:'',modelo:'',fecha:'',retenes:'',aceite:'',muelleIz:'',muelleDe:'',rows:emptyRows(FORK_ROWS)},
    shock:{marca:'',modelo:'',fecha:'',longMuelle:'',muelle:'',aceite:'',rows:emptyRows(SHOCK_ROWS)},
    maint:true};
}
function uid(){return 'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function sampleFicha(){
  const f=newFicha();
  f.moto={marca:'YAMAHA',modelo:'R6',anio:'',modalidad:'CIRCUITO',color:'indigo'};
  f.shock.marca='OHLINS';f.shock.modelo='YA3051';f.shock.fecha='2026-01-23';
  f.shock.longMuelle='150mm';f.shock.muelle='95Nmm';f.shock.aceite='105';
  const r=f.shock.rows;
  r.altura[0]='301';r.precarga[0]='12mm';r.precarga[4]='16mm';
  r.comp[0]='8c';r.comp[4]='20c';r.compAlta[0]='25c';r.compAlta[4]='50c';r.ext[0]='10c';r.ext[4]='45c';
  return f;
}
function merge(def,obj){
  if(Array.isArray(def))return def.map((d,i)=>merge(d,obj&&obj[i]));
  if(def&&typeof def==='object'){const o={};Object.keys(def).forEach(k=>{o[k]=merge(def[k],obj&&typeof obj==='object'?obj[k]:undefined)});return o}
  if(typeof def==='boolean')return typeof obj==='boolean'?obj:def;
  return obj==null?def:String(obj).slice(0,80);
}
function normFicha(f){
  const m=merge(newFicha(),f);
  if(!COLORS.some(c=>c[0]===m.moto.color))m.moto.color='indigo';
  m.id=f&&f.id?String(f.id):uid();m.ts=Number(f&&f.ts)||Date.now();
  return m;
}

/* ---------- Guardado en este móvil ---------- */
const KEY='fichas-setting-v1';
let store={list:[],cur:null},timer=null;
function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){}
  if(raw){
    try{
      const d=JSON.parse(raw);
      store.list=(Array.isArray(d.list)?d.list:[]).map(normFicha);
      store.cur=d.cur;
    }catch(e){store.list=[]}
  }else{store.list=[sampleFicha()]}
  if(!store.list.length)store.list=[newFicha()];
  if(!store.list.some(f=>f.id===store.cur))store.cur=store.list[0].id;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({list:store.list,cur:store.cur}));return true}
  catch(e){msg('No se pudo guardar en este móvil. Revisa el espacio y los permisos del navegador.',true);return false}
}
function saveSoon(){clearTimeout(timer);timer=setTimeout(()=>{save();renderList()},300)}
const cur=()=>store.list.find(f=>f.id===store.cur);
let msgTimer=null;
function msg(t,err){const m=$('#msg');m.textContent=t||'';m.className='msg'+(err?' err':'');clearTimeout(msgTimer);if(t&&!err)msgTimer=setTimeout(()=>{m.textContent=''},5000)}

function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setPath(o,p,v){const ks=p.split('.'),last=ks.pop();const t=ks.reduce((a,k)=>a[k],o);t[last]=v}
function inp(path,label,opts){
  opts=opts||{};
  const lab=el('label','field');lab.appendChild(el('span',null,label));
  const i=document.createElement('input');i.type=opts.type||'text';i.setAttribute('data-path',path);i.autocomplete='off';
  if(opts.max)i.maxLength=opts.max;
  if(opts.mode)i.inputMode=opts.mode;
  if(opts.list)i.setAttribute('list',opts.list);
  if(opts.ph)i.placeholder=opts.ph;
  lab.appendChild(i);return lab;
}
function section(cls,title){
  const s=el('section','sec '+cls);const hd=el('div','sec-h');hd.appendChild(el('h2','sec-t',title));s.appendChild(hd);
  const b=el('div','sec-b');s.appendChild(b);$('#formRoot').appendChild(s);return b;
}
function grid(parent,items){const g=el('div','grid');items.forEach(x=>g.appendChild(x));parent.appendChild(g)}
function setTable(parent,base,rows){
  const wrap=el('div','tablewrap'),t=el('table','set'),th=el('thead'),hr=el('tr');
  hr.appendChild(el('th','lab',''));
  COLS.forEach(c=>hr.appendChild(el('th',null,c)));
  th.appendChild(hr);t.appendChild(th);
  const tb=el('tbody');
  rows.forEach(r=>{
    const tr=el('tr');tr.appendChild(el('th','lab',r[1]));
    for(let i=0;i<COLS.length;i++){
      const td=el('td',i===4?'tot':'');
      const x=document.createElement('input');x.type='text';x.autocomplete='off';x.maxLength=20;
      x.setAttribute('data-path',base+'.rows.'+r[0]+'.'+i);
      x.setAttribute('aria-label',r[1]+', '+COLS[i]);
      td.appendChild(x);tr.appendChild(td);
    }
    tb.appendChild(tr);
  });
  t.appendChild(tb);wrap.appendChild(t);parent.appendChild(wrap);
}
function buildForm(){
  let b=section('s-moto','Motocicleta');
  const mh=b.parentNode.firstChild,sel=document.createElement('select');
  sel.className='colsel';sel.setAttribute('data-path','moto.color');sel.setAttribute('aria-label','Color de la casilla Motocicleta');
  COLORS.forEach(c=>{const o=document.createElement('option');o.value=c[0];o.textContent=c[1];sel.appendChild(o)});mh.appendChild(sel);
  grid(b,[inp('moto.marca','Marca',{max:30}),inp('moto.modelo','Modelo',{max:30}),inp('moto.anio','Año',{max:4,mode:'numeric'}),inp('moto.modalidad','Modalidad',{max:30,list:'dlMod'})]);

  b=section('s-fork','Horquilla (FF)');

  grid(b,[inp('fork.marca','Marca',{max:30}),inp('fork.modelo','Modelo',{max:30}),inp('fork.fecha','Fecha revisión',{type:'date'})]);
  grid(b,[inp('fork.retenes','Retenes',{max:30}),inp('fork.aceite','Aceite',{max:30}),inp('fork.muelleIz','Muelle izq.',{max:30}),inp('fork.muelleDe','Muelle dcho.',{max:30})]);
  b.appendChild(el('div','subh','Settings'));
  setTable(b,'fork',FORK_ROWS);

  b=section('s-shock','Amortiguador (RR)');

  grid(b,[inp('shock.longMuelle','Long. muelle',{max:30}),inp('shock.muelle','Muelle',{max:30}),inp('shock.aceite','Aceite',{max:30})]);
  b.appendChild(el('div','subh','Settings'));
  setTable(b,'shock',SHOCK_ROWS);

  b=section('s-mant','Mantenimiento');
  const ck=el('label','check'),c=document.createElement('input');c.type='checkbox';c.setAttribute('data-path','maint');
  ck.append(c,document.createTextNode('Incluir esta tabla en el PDF'));b.appendChild(ck);
  const wrap=el('div','tablewrap'),t=el('table','mt'),th=el('thead'),h1=el('tr');
  h1.appendChild(el('th','lab',''));
  MAINT_COLS.forEach(c=>{const x=el('th');x.appendChild(document.createTextNode(c[0]));if(c[1]){x.appendChild(document.createElement('br'));x.appendChild(document.createTextNode(c[1]))}h1.appendChild(x)});
  th.appendChild(h1);t.appendChild(th);
  const tb=el('tbody');
  MAINT_ROWS.forEach(r=>{

  });

}
function fill(){
  const f=cur();
  $$('[data-path]').forEach(i=>{
    const v=getPath(f,i.getAttribute('data-path'));
    if(i.type==='checkbox')i.checked=!!v;else i.value=v==null?'':v;
  });
  applyMotoColor();
}
function applyMotoColor(){
  const c=colorOf(cur().moto.color),s=$('.s-moto');if(!s)return;
  s.style.setProperty('--head-bg',c[2]);s.style.setProperty('--head-fg',c[3]);
}
document.addEventListener('input',e=>{
  const i=e.target;if(!i.getAttribute)return;
  const p=i.getAttribute('data-path');if(!p)return;
  const f=cur();setPath(f,p,i.type==='checkbox'?i.checked:i.value);f.ts=Date.now();if(p==='moto.color')applyMotoColor();saveSoon();
});

function fmtD(iso){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');return m?m[3]+'/'+m[2]+'/'+m[1]:(iso||'')}
function ftitle(f){return [f.moto.marca,f.moto.modelo].filter(Boolean).join(' ')||'Ficha sin título'}
function fsub(f){
  const d=f.shock.fecha||f.fork.fecha;
  const e=new Date(f.ts);
  return (d?'Revisión '+fmtD(d):'Sin fecha de revisión')+' · editada '+pad(e.getDate())+'/'+pad(e.getMonth()+1)+'/'+e.getFullYear();
}
function renderList(){
  const box=$('#list');box.textContent='';
  store.list.slice().sort((a,b)=>b.ts-a.ts).forEach(f=>{
    const row=el('div','fitem'+(f.id===store.cur?' cur':''));
    const open=el('button','open');open.type='button';
    open.appendChild(el('strong',null,ftitle(f)));open.appendChild(el('span',null,fsub(f)));
    open.addEventListener('click',()=>{store.cur=f.id;save();fill();renderList();window.scrollTo(0,0);msg('Ficha abierta: '+ftitle(f))});
    const dup=el('button','mini','Duplicar');dup.type='button';
    dup.addEventListener('click',()=>{
      const c=normFicha(JSON.parse(JSON.stringify(f)));c.id=uid();c.ts=Date.now();
      store.list.push(c);store.cur=c.id;save();fill();renderList();window.scrollTo(0,0);msg('Ficha duplicada. Cambia lo que haga falta.');
    });
    const del=el('button','mini','Borrar');del.type='button';
    let armed=false,t=null;
    del.addEventListener('click',()=>{
      if(!armed){armed=true;del.textContent='¿Seguro?';del.classList.add('armed');t=setTimeout(()=>{armed=false;del.textContent='Borrar';del.classList.remove('armed')},3000);return}
      clearTimeout(t);
      store.list=store.list.filter(x=>x.id!==f.id);
      if(!store.list.length)store.list=[newFicha()];
      if(store.cur===f.id)store.cur=store.list[0].id;
      save();fill();renderList();
    });
    row.append(open,dup,del);box.appendChild(row);
  });
}
function newOne(){
  const f=newFicha();store.list.push(f);store.cur=f.id;save();fill();renderList();window.scrollTo(0,0);
  const i=$('[data-path="moto.marca"]');if(i)i.focus();
  msg('Ficha nueva en blanco.');
}

  for(const ch of String(s==null?'':s)){
    const c=ch.charCodeAt(0);
    if(WIN[ch])o+=String.fromCharCode(WIN[ch]);
    else if(c>=32&&c<=126||c>=160&&c<=255)o+=ch;
    else o+='?';
  }
  return o;
}

    else if(SPECIAL[ch])w+=SPECIAL[ch];
    else{const b=ch.normalize('NFD').charCodeAt(0);w+=(b>=32&&b<=126)?T[b-32]:556}
  }

}

    obj(ap,'<</Type/XObject/Subtype/Form/BBox[0 0 '+n(w)+' '+n(h)+']/Resources<</Font<</F1 5 0 R>>>>/Length '+bytes.length+'>>',bytes);
    const box='['+[fld.x,Y(fld.y+fld.h),fld.x+fld.w,Y(fld.y)].map(n).join(' ')+']';
    obj(id,'<</Type/Annot/Subtype/Widget/FT/Tx/T'+pdfStr(fld.name)+'/V'+pdfStr(v)+'/Rect'+box+'/F 4/Ff 0/MaxLen 20/DA(/F1 10 Tf 1 1 1 rg)/MK<<>>/AP<</N '+ap+' 0 R>>>>');
  });
  const xr=pos;
  const count=10+fields.length*2;
  let x='xref\n0 '+count+'\n0000000000 65535 f \n';
  for(let i=1;i<count;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  adds(x+'trailer\n<</Size '+count+'/Root 1 0 R/Info 8 0 R>>\nstartxref\n'+xr+'\n%%EOF');
  const out=new Uint8Array(pos);let o=0;chunks.forEach(c=>{out.set(c,o);o+=c.length});
  return out;
}
window.__makePdf=makePdf;

/* ---------- Compartir y descargar ---------- */
function pdfName(f){
  const base=[f.moto.marca,f.moto.modelo].filter(Boolean).join('-')||'moto';
  return 'Hoja-Setting-'+base.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'')+'-'+todayISO+'.pdf';
}
function download(file){
  const url=URL.createObjectURL(file),a=document.createElement('a');
  a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),8000);
}
function buildFile(){
  try{const f=cur();return new File([makePdf(f)],pdfName(f),{type:'application/pdf'})}
  catch(e){msg('No se pudo crear el PDF.',true);return null}
}
function sharePdf(){
  const file=buildFile();if(!file)return;
  let can=false;
  try{can=!!(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
  if(can){
    navigator.share({files:[file],title:'Hoja de setting'}).then(()=>msg('Ficha compartida.')).catch(e=>{
      if(e&&e.name==='AbortError')return;
      download(file);msg('No se pudo abrir el menú de compartir. El PDF se ha descargado.');
    });
  }else{download(file);msg('Este navegador no puede compartir archivos. El PDF se ha descargado.')}
}
function pdfOnly(){const file=buildFile();if(!file)return;download(file);msg('PDF descargado. Búscalo en la carpeta Descargas.')}

/* ---------- Inicio ---------- */
$$('.js-share').forEach(b=>b.addEventListener('click',sharePdf));
$$('.js-pdf').forEach(b=>b.addEventListener('click',pdfOnly));
$$('.js-new').forEach(b=>b.addEventListener('click',newOne));
buildForm();load();fill();renderList();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
})();
